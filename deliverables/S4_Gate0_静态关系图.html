<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S4 断链破阵 — Gate 0 静态关系图</title>
<style>
  body { background:#0a0a14; color:#ddd; font-family:'Microsoft YaHei',sans-serif; margin:0; padding:16px; }
  h2 { color:#ffd35a; margin:4px 0 12px; font-size:15px; }
  .row { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
  .card { background:#12121f; border:1px solid #2a2040; border-radius:10px; padding:12px 12px 4px; }
  .card h3 { margin:0 0 8px; color:#d7bde2; font-size:13px; text-align:center; }
  canvas { display:block; border-radius:4px; }
  .legend { margin-top:20px; padding:16px; background:#12121f; border:1px solid #2a2040; border-radius:8px; display:flex; flex-wrap:wrap; gap:14px; justify-content:center; font-size:11px; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; }
</style>
</head>
<body>
<h2>🔬 S4 Gate 0 — 静态关系图（不实现移动和战斗）</h2>
<div class="row">
  <div class="card"><h3>图1：阶段1 单分支教学阵（0–6s）</h3><canvas id="c1" width="213" height="456"></canvas></div>
  <div class="card"><h3>图2：阶段2 双分支+甲链（5–13s）</h3><canvas id="c2" width="213" height="456"></canvas></div>
  <div class="card"><h3>图3：阶段3 完整命核阵+旧残阵叠压（11–25s）</h3><canvas id="c3" width="213" height="456"></canvas></div>
</div>
<div class="legend">
  <span><span class="dot" style="background:#ffd35a;box-shadow:0 0 6px #ffd35a"></span> 金色命核</span>
  <span><span class="dot" style="background:#5bc0ff;box-shadow:0 0 6px #5bc0ff"></span> 蓝色关节/连接点</span>
  <span><span class="dot" style="background:#ff4040;box-shadow:0 0 6px #ff4040"></span> 红色威胁刃</span>
  <span style="color:#b02020">━━━ 甲链（不可切）</span>
  <span style="color:#5bc0ff">━━━ 可切能量分支</span>
  <span style="color:#ffd35a">━━━ Boss主链</span>
  <span style="color:#ffffff66">┅┅┅ 候选刀路</span>
</div>

<script>
const D_W = 213, D_H = 456;

// ---- 绘制工具 ----
function drawPanel(canvasId, drawFn) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,D_W,D_H);
  // 背景
  const bg = ctx.createLinearGradient(0,0,0,D_H);
  bg.addColorStop(0,'#0d0515'); bg.addColorStop(0.3,'#120a1e');
  bg.addColorStop(0.65,'#100d15'); bg.addColorStop(1,'#0c0c12');
  ctx.fillStyle = bg; ctx.fillRect(0,0,D_W,D_H);

  // Boss 区
  ctx.fillStyle = 'rgba(60,20,80,0.3)';
  ctx.fillRect(0,0,D_W,115);
  ctx.strokeStyle = 'rgba(100,60,130,0.2)';
  ctx.setLineDash([4,8]); ctx.beginPath();
  ctx.moveTo(0,115); ctx.lineTo(D_W,115); ctx.stroke(); ctx.setLineDash([]);

  // 防线
  ctx.strokeStyle = 'rgba(255,50,30,0.35)';
  ctx.setLineDash([8,4]); ctx.lineWidth=1.5; ctx.beginPath();
  ctx.moveTo(15,345); ctx.lineTo(D_W-15,345); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,30,10,0.06)'; ctx.fillRect(0,335,D_W,20);

  // 防线标签
  ctx.fillStyle='rgba(255,80,50,0.5)'; ctx.font='9px "Microsoft YaHei"'; ctx.textAlign='right';
  ctx.fillText('防线',D_W-18,355);

  // Boss 剪影
  const bx=106, by=50;
  ctx.fillStyle='#0d0515'; ctx.shadowColor='rgba(60,20,80,0.4)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.roundRect(bx-18,by-30,36,50,6); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(90,30,130,0.5)'; ctx.beginPath(); ctx.arc(bx+12,by-18,5,0,Math.PI*2); ctx.fill();

  // 玩家
  const px=106, py=380;
  ctx.fillStyle='#2a2a3a'; ctx.beginPath(); ctx.roundRect(px-12,py-8,24,24,6); ctx.fill();
  ctx.fillStyle='#5bc0ff50'; ctx.beginPath(); ctx.arc(px,py-12,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='8px "Consolas"'; ctx.textAlign='center';
  ctx.fillText('玩家',px,py+20);

  drawFn(ctx, bx, by, px, py);
}

// ---- 节点绘制 ----
function drawCore(ctx, x, y, r, label) {
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.7,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.7,0); ctx.closePath();
  ctx.fillStyle='rgba(255,200,40,0.75)'; ctx.fill();
  ctx.strokeStyle='#ffd35a'; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowColor='#ffd35a'; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
  if (label) { ctx.fillStyle='#fff'; ctx.font='bold 9px "Microsoft YaHei"'; ctx.textAlign='center';
    ctx.fillText(label,0,r+14); }
  ctx.restore();
}
function drawJoint(ctx, x, y, r, label) {
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle='rgba(80,160,240,0.65)'; ctx.fill();
  ctx.strokeStyle='rgba(120,200,255,0.7)'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='rgba(180,220,255,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-r*0.5,0); ctx.lineTo(r*0.5,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-r*0.5); ctx.lineTo(0,r*0.5); ctx.stroke();
  if (label) { ctx.fillStyle='#5bc0ff'; ctx.font='bold 8px "Microsoft YaHei"'; ctx.textAlign='center';
    ctx.fillText(label,0,r+12); }
  ctx.restore();
}
function drawThreat(ctx, x, y, r, label, urgent) {
  ctx.save(); ctx.translate(x,y);
  ctx.rotate(Math.PI);
  ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(-r*0.75,r*0.5); ctx.lineTo(r*0.75,r*0.5); ctx.closePath();
  ctx.fillStyle=urgent?'rgba(255,40,20,0.9)':'rgba(200,40,25,0.7)';
  ctx.fill(); ctx.strokeStyle='#ff4040'; ctx.lineWidth=2; ctx.stroke();
  if (urgent) { ctx.shadowColor='#ff2020'; ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0; }
  if (label) { ctx.rotate(Math.PI); ctx.fillStyle='#ff8080'; ctx.font='bold 8px "Microsoft YaHei"'; ctx.textAlign='center';
    ctx.fillText(label,0,-r-12); }
  ctx.restore();
}
function drawEdge(ctx, x1,y1,x2,y2,color,width,dashed) {
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width;
  if (dashed) ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}
function drawCandidateSlash(ctx, x1,y1,x2,y2,color) {
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.5;
  ctx.setLineDash([4,4]); ctx.globalAlpha=0.6;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  // 小箭头
  const ang=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-Math.cos(ang-0.4)*8,y2-Math.sin(ang-0.4)*8);
  ctx.lineTo(x2-Math.cos(ang+0.4)*8,y2-Math.sin(ang+0.4)*8); ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
  ctx.restore();
}
function drawHull(ctx, pts) {
  if (!pts||pts.length<3) return;
  ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath(); ctx.fillStyle='rgba(60,20,80,0.12)'; ctx.fill();
  ctx.strokeStyle='rgba(100,60,130,0.3)'; ctx.lineWidth=2; ctx.setLineDash([6,3]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
}

// ================================================================
// 图1：阶段1 单分支教学阵
// ================================================================
drawPanel('c1',(ctx,bx,by,px,py)=>{
  const ox=100, oy=170; // 阵型原点

  // 外轮廓
  drawHull(ctx, [
    {x:ox-55,y:oy-10},{x:ox+55,y:oy-10},
    {x:ox+40,y:oy+140},{x:ox-70,y:oy+140}
  ]);

  // 节点
  const jy=oy+30, tay=oy+100, tby=oy+115;
  drawJoint(ctx,ox-30,jy,9,'可切关节');
  drawThreat(ctx,ox-55,tay,10,'红刃A',false);
  drawThreat(ctx,ox+15,tby,10,'红刃B',false);

  // 连接线（能量：蓝 / 普通：灰）
  drawEdge(ctx,ox-30,jy,ox-55,tay,'rgba(80,160,240,0.55)',2.5,false);
  drawEdge(ctx,ox-30,jy,ox+15,tby,'rgba(255,80,60,0.4)',2,false);

  // 候选刀路1：安全路线（横斩两红刃）
  const sx1=ox-70,sy1=tay,sx2=ox+30,sy2=tby;
  drawCandidateSlash(ctx,sx1,sy1-5,sx2,sy2+5,'rgba(255,180,100,0.5)');
  ctx.fillStyle='rgba(255,180,100,0.6)'; ctx.font='8px "Microsoft YaHei"'; ctx.textAlign='left';
  ctx.fillText('路线1: 安全清红刃',sx1-10,sy1-22);

  // 候选刀路2：断链路线（斜斩蓝关节）
  drawCandidateSlash(ctx,px-30,py,ox-30,jy,'rgba(91,192,255,0.5)');
  ctx.fillStyle='rgba(91,192,255,0.6)'; ctx.font='8px "Microsoft YaHei"'; ctx.textAlign='right';
  ctx.fillText('路线2: 断链蓄势',px-10,py-5);

  // 下游高亮（虚线框）
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.roundRect(ox-70,tay-15,110,tby-tay+30,4); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='7px "Consolas"';
  ctx.fillText('断链将失效',ox-20,tby+28);

  // Boss主链（虚线，从Boss到关节）
  drawEdge(ctx,bx,by+20,ox-30,jy,'rgba(255,211,90,0.18)',1.5,true);
});

// ================================================================
// 图2：阶段2 双分支+甲链
// ================================================================
drawPanel('c2',(ctx,bx,by,px,py)=>{
  const ox=105, oy=165;

  // 外轮廓
  drawHull(ctx,[
    {x:ox-65,y:oy-5},{x:ox+65,y:oy-5},
    {x:ox+55,y:oy+155},{x:ox-75,y:oy+155}
  ]);

  // 左分支
  const jl=24, tly=oy+110;
  drawJoint(ctx,ox-45,oy+30,9,'可切关节');
  drawThreat(ctx,ox-45,tly,10,'红刃L',false);

  // 右分支
  drawJoint(ctx,ox+45,oy+40,8,'普通关节');
  drawThreat(ctx,ox+45,tly,10,'红刃R',true); // 接近防线

  // 甲链（粗黑红线，横跨中间）
  const ax1=ox+45, ay1=oy+40, ax2=ox-45, ay2=oy+75, ax3=ox-45, ay3=tly;
  ctx.save(); ctx.strokeStyle='rgba(180,20,20,0.55)'; ctx.lineWidth=4;
  ctx.shadowColor='rgba(255,20,20,0.3)'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.moveTo(ax3,ay3-15); ctx.lineTo(ax2,ay2+5); ctx.lineTo(ax1,ay1+5); ctx.stroke();
  ctx.shadowBlur=0;

  // 甲链标签
  ctx.fillStyle='rgba(255,60,40,0.7)'; ctx.font='bold 9px "Microsoft YaHei"'; ctx.textAlign='center';
  ctx.fillText('甲链 不可切',ox,oy+65);

  // 连接线
  drawEdge(ctx,ox-45,oy+30,ox-45,tly,'rgba(80,160,240,0.5)',2.5,false);
  drawEdge(ctx,ox+45,oy+40,ox+45,tly,'rgba(255,80,60,0.35)',2,false);

  // 候选刀路1：断左分支（绕开甲链）
  drawCandidateSlash(ctx,px-50,py,ox-47,oy+30,'rgba(91,192,255,0.5)');
  ctx.fillStyle='rgba(91,192,255,0.5)'; ctx.font='7px "Microsoft YaHei"'; ctx.textAlign='right';
  ctx.fillText('断左支蓄势',px-20,py-8);

  // 候选刀路2：保命（先清右刃）
  drawCandidateSlash(ctx,px+10,py-20,ox+45,tly,'rgba(255,180,100,0.5)');
  ctx.fillStyle='rgba(255,180,100,0.5)'; ctx.font='7px "Microsoft YaHei"';
  ctx.fillText('保命先清',ox+60,tly+20);

  // 叉号警告
  ctx.fillStyle='rgba(255,40,40,0.5)'; ctx.font='bold 14px "Arial"'; ctx.textAlign='center';
  ctx.fillText('✗',ox+5,oy+55);
});

// ================================================================
// 图3：阶段3 完整命核阵+旧残阵叠压
// ================================================================
drawPanel('c3',(ctx,bx,by,px,py)=>{
  // === 旧残阵（灰色，已部分透明） ===
  const oldOx=85, oldOy=310;
  ctx.save(); ctx.globalAlpha=0.35;
  drawThreat(ctx,oldOx+15,oldOy+5,10,'残留红刃',true);
  ctx.strokeStyle='rgba(255,50,20,0.4)'; ctx.lineWidth=1; ctx.beginPath();
  ctx.roundRect(oldOx-75,oldOy-15,140,120,4); ctx.stroke();
  ctx.fillStyle='rgba(255,50,20,0.3)'; ctx.font='8px "Microsoft YaHei"'; ctx.textAlign='center';
  ctx.fillText('旧残阵',oldOx,oldOy-25);
  ctx.restore();

  // === 新阵 ===
  const ox=108, oy=155;

  // 外轮廓
  drawHull(ctx,[
    {x:ox-70,y:oy-20},{x:ox+70,y:oy-20},
    {x:ox+55,y:oy+160},{x:ox-75,y:oy+160}
  ]);

  // 命核
  drawCore(ctx,ox,oy,12,'命核');

  // 左分支
  drawJoint(ctx,ox-40,oy+40,9,'可切关节');
  drawThreat(ctx,ox-55,oy+115,10,'红刃LA',false);
  drawThreat(ctx,ox-20,oy+125,10,'红刃LB',true);

  // 右分支
  drawJoint(ctx,ox+40,oy+48,8,'关节');
  drawThreat(ctx,ox+55,oy+120,10,'红刃RA',false);

  // 甲链（横跨）
  const armY=oy+85;
  ctx.save(); ctx.strokeStyle='rgba(180,20,20,0.5)'; ctx.lineWidth=4;
  ctx.shadowColor='rgba(255,20,20,0.25)'; ctx.shadowBlur=5;
  ctx.beginPath(); ctx.moveTo(ox+40,oy+50); ctx.lineTo(ox-10,armY); ctx.lineTo(ox-20,oy+120); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,60,40,0.6)'; ctx.font='bold 8px "Microsoft YaHei"'; ctx.textAlign='center';
  ctx.fillText('甲链',ox+2,armY-2);

  // 连接线
  // Boss主链（命核↔Boss）
  drawEdge(ctx,bx,by+25,ox,oy-12,'rgba(255,211,90,0.7)',3.5,false);
  // 命核↔关节
  drawEdge(ctx,ox,oy,ox-40,oy+40,'rgba(255,211,90,0.4)',2,true);
  drawEdge(ctx,ox,oy,ox+40,oy+48,'rgba(255,211,90,0.4)',2,true);
  // 关节↔红刃
  drawEdge(ctx,ox-40,oy+40,ox-55,oy+115,'rgba(80,160,240,0.5)',2.5,false);
  drawEdge(ctx,ox-40,oy+40,ox-20,oy+125,'rgba(255,80,60,0.35)',2,false);
  drawEdge(ctx,ox+40,oy+48,ox+55,oy+120,'rgba(255,80,60,0.35)',2,false);

  // 候选刀路1：冒险反卷（绕开甲链，斩命核）
  const s1x=ox-55,s1y=oy+125;
  drawCandidateSlash(ctx,s1x,s1y,ox,oy,'rgba(255,211,90,0.5)');
  ctx.fillStyle='rgba(255,211,90,0.6)'; ctx.font='8px "Microsoft YaHei"'; ctx.textAlign='right';
  ctx.fillText('刀势≥70：反卷！',ox-45,oy-15);

  // 候选刀路2：先救旧残阵红刃
  drawCandidateSlash(ctx,px-20,py,oldOx+15,oldOy+5,'rgba(255,120,80,0.5)');
  ctx.fillStyle='rgba(255,120,80,0.5)'; ctx.font='8px "Microsoft YaHei"';
  ctx.fillText('先救旧残留',px-40,py-5);

  // 候选刀路3：断链蓄势
  drawCandidateSlash(ctx,ox,oy-20,ox-40,oy+40,'rgba(91,192,255,0.5)');
  ctx.fillStyle='rgba(91,192,255,0.5)'; ctx.font='8px "Microsoft YaHei"';
  ctx.fillText('断链蓄势',ox,oy-28);

  // 下游高亮区（虚线框：左分支红刃）
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.roundRect(ox-65,oy+105,60,30,4); ctx.stroke(); ctx.setLineDash([]);

  // 主链点亮提示
  ctx.fillStyle='rgba(255,211,90,0.5)'; ctx.font='bold 9px "Microsoft YaHei"';
  ctx.fillText('刀势≥70 → 主链点亮',ox-30,oy+150);
});
</script>
</body>
</html>
